[project]
name = "dummy"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.2",
]

[dependency-groups]
dev = [
  "ruff>=0.16.2",
  "ty>=0.0.70",
]

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "ANN",  # flake8-annotations
  "F401", # unused-import
]

[tool.ty.rules]
all = "error"
